pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

// Autolinking — RN 0.78 fixed the monorepo bug that was forcing manual includes
// on 0.77.3. This single call discovers and includes every native module from
// node_modules automatically.
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'RNExample'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Local 100ms packages — file-linked to the sibling checkout via package.json,
// so autolinking can't discover them through node_modules. Wire them up manually.
include ':100mslive_react-native-hms'
project(':100mslive_react-native-hms').projectDir = new File(rootProject.projectDir, '../../../react-native-hms/android')

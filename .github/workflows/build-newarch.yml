name: Build (New Architecture)

# Parallel sibling to build.yml. Same triggers, same workflow body, but every
# native build runs with the New Architecture (Fabric + TurboModules + Codegen)
# flag set. Phase 1H of the new-arch migration: catch regressions on the
# new-arch path without blocking merges on the existing old-arch build.
#
# Advisory only — not yet in the required-checks list for branch protection.
# Once 2.0.0-alpha.0 ships and customers are exercising new-arch, promote this
# workflow to required.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - doc/**
      - .git/
      - .vscode/
      - "**.txt"

permissions:
  checks: write
  contents: read

jobs:
  build_android_newarch:
    name: Build Android App (new arch)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Validate Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            packages/react-native-hms/package-lock.json
            packages/react-native-hms/example/package-lock.json
            packages/react-native-room-kit/package-lock.json
            packages/react-native-room-kit/example/package-lock.json

      - name: Display environment info
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Java: $(java -version 2>&1 | head -1)"

      # Distinct cache key from build.yml so new-arch and old-arch don't fight
      # over the same Gradle build outputs.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-newarch-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-newarch-

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/react-native-room-kit/example/android/.gradle
            packages/react-native-room-kit/example/android/app/build
          key: ${{ runner.os }}-gradle-build-newarch-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-newarch-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
          key: ${{ runner.os }}-ndk-27.1.12297006
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Install dependencies (react-native-hms)
        working-directory: packages/react-native-hms
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install dependencies (react-native-hms/example)
        working-directory: packages/react-native-hms/example
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install dependencies (react-native-room-kit)
        working-directory: packages/react-native-room-kit
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install dependencies (react-native-room-kit/example)
        working-directory: packages/react-native-room-kit/example
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build and pack react-native-hms
        working-directory: packages/react-native-hms
        run: |
          npm run prepack
          npm pack
          echo "HMS_PACKAGE=$(ls -t *.tgz | head -1)" >> $GITHUB_ENV

      - name: Link react-native-hms to room-kit
        working-directory: packages/react-native-room-kit
        run: |
          npm install ../react-native-hms/${{ env.HMS_PACKAGE }}
          npm run prepack

      - name: Make Gradlew Executable
        working-directory: packages/react-native-room-kit/example/android
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        working-directory: packages/react-native-room-kit/example/android
        run: ./gradlew --version

      # The one and only line that differs from build.yml: -PnewArchEnabled=true
      - name: Build Android App (new arch)
        working-directory: packages/react-native-room-kit/example/android
        run: |
          ./gradlew assembleRelease \
            -PnewArchEnabled=true \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true

      - name: Verify APK was built
        working-directory: packages/react-native-room-kit/example/android
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ New-arch APK built successfully"
            ls -lh "$APK_PATH"
            echo "APK size: $(du -h "$APK_PATH" | cut -f1)"
          else
            echo "❌ APK not found at $APK_PATH"
            echo "Available files:"
            find app/build/outputs -type f
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-newarch-${{ github.sha }}
          path: packages/react-native-room-kit/example/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-newarch-${{ github.sha }}
          path: |
            packages/react-native-room-kit/example/android/app/build/outputs/logs/
            packages/react-native-room-kit/example/android/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate job summary
        if: always()
        run: |
          echo "### Android Build Summary (new arch)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: new (Fabric + TurboModules)" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ubuntu-24.04" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Java**: $(java -version 2>&1 | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "packages/react-native-room-kit/example/android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ New-arch APK built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ New-arch APK build failed" >> $GITHUB_STEP_SUMMARY
          fi

  build_ios_newarch:
    name: Build iOS App (new arch)
    if: github.event.pull_request.draft == false
    runs-on: macos-14
    timeout-minutes: 60

    # RCT_NEW_ARCH_ENABLED=1 needs to be set BEFORE pod install (the Podfile
    # reads it to decide :fabric_enabled) AND before xcodebuild. Setting at the
    # job level ensures it's exported to every step.
    env:
      RCT_NEW_ARCH_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcode-select -p

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            packages/react-native-hms/package-lock.json
            packages/react-native-hms/example/package-lock.json
            packages/react-native-room-kit/package-lock.json
            packages/react-native-room-kit/example/package-lock.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          gem install cocoapods -v '~> 1.15'
          pod --version
          echo "✅ CocoaPods installed"

      # New-arch iOS builds compile generated Fabric C++ via CMake. macos-14
      # runners ship CMake but without a default make program set, so the build
      # fails with "CMAKE_MAKE_PROGRAM is not set" before xcodebuild can start.
      # Install ninja (a faster generator anyway) and set CMAKE_MAKE_PROGRAM.
      - name: Install CMake build tools (Ninja)
        run: |
          brew install ninja
          echo "CMAKE_MAKE_PROGRAM=$(which ninja)" >> $GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
          echo "✅ Ninja installed at $(which ninja)"

      - name: Display environment info
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Ruby: $(ruby --version | cut -d' ' -f1-2)"
          echo "CocoaPods: $(pod --version)"
          echo "RCT_NEW_ARCH_ENABLED: $RCT_NEW_ARCH_ENABLED"

      # Distinct cache keys from build.yml — old-arch and new-arch produce
      # different Pods / DerivedData, can't share a cache.
      - name: Cache CocoaPods (new arch)
        id: cache-pods
        uses: actions/cache@v4
        with:
          path: packages/react-native-room-kit/example/ios/Pods
          key: ${{ runner.os }}-pods-newarch-${{ hashFiles('packages/react-native-room-kit/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-newarch-

      - name: Cache iOS Derived Data (new arch)
        uses: actions/cache@v4
        with:
          path: packages/react-native-room-kit/example/ios/build
          key: ${{ runner.os }}-ios-derived-newarch-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ios-derived-newarch-

      - name: Install dependencies (react-native-hms)
        working-directory: packages/react-native-hms
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install dependencies (react-native-hms/example)
        working-directory: packages/react-native-hms/example
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install dependencies (react-native-room-kit)
        working-directory: packages/react-native-room-kit
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install dependencies (react-native-room-kit/example)
        working-directory: packages/react-native-room-kit/example
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build and pack react-native-hms
        working-directory: packages/react-native-hms
        run: |
          npm run prepack
          npm pack
          echo "HMS_PACKAGE=$(ls -t *.tgz | head -1)" >> $GITHUB_ENV

      - name: Link react-native-hms to room-kit
        working-directory: packages/react-native-room-kit
        run: |
          npm install ../react-native-hms/${{ env.HMS_PACKAGE }}
          npm run prepack

      - name: Install CocoaPods dependencies (new arch)
        working-directory: packages/react-native-room-kit/example/ios
        run: |
          # RCT_NEW_ARCH_ENABLED=1 is in the job env; the Podfile reads it.
          pod install --repo-update || pod install --repo-update

      - name: Verify Pods installation
        working-directory: packages/react-native-room-kit/example/ios
        run: |
          if [ -d "Pods" ]; then
            echo "✅ Pods installed successfully"
            echo "Pods directory size: $(du -sh Pods | cut -f1)"
          else
            echo "❌ Pods directory not found"
            exit 1
          fi

      - name: Build iOS App (new arch, unsigned for validation)
        id: ios-build
        working-directory: packages/react-native-room-kit/example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace RNExample.xcworkspace \
            -scheme RNExample \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee xcodebuild.log

      - name: Verify iOS build output
        working-directory: packages/react-native-room-kit/example/ios
        run: |
          if [ -d "build/Build/Products/Release-iphonesimulator/RNExample.app" ]; then
            echo "✅ New-arch iOS app built successfully"
            ls -lh build/Build/Products/Release-iphonesimulator/
          else
            echo "❌ iOS app not found"
            find build/Build/Products -type d -name "*.app" || echo "No .app found"
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-newarch-${{ github.sha }}
          path: |
            packages/react-native-room-kit/example/ios/xcodebuild.log
            packages/react-native-room-kit/example/ios/build/Logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate job summary
        if: always()
        run: |
          echo "### iOS Build Summary (new arch)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: new (Fabric + TurboModules)" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: macos-14 (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode**: $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Ruby**: $(ruby --version | cut -d' ' -f1-2)" >> $GITHUB_STEP_SUMMARY
          echo "- **CocoaPods**: $(pod --version 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "packages/react-native-room-kit/example/ios/build/Build/Products/Release-iphonesimulator/RNExample.app" ]; then
            echo "✅ New-arch iOS app built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ New-arch iOS app build failed" >> $GITHUB_STEP_SUMMARY
          fi
